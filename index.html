<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Colbert Pierre - E-Card</title>
    
    <!-- Import Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Import Google Fonts for elegant typography -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Import FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            background-image: radial-gradient(circle at top right, #1e293b, #020617);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .title-font {
            font-family: 'Playfair Display', serif;
        }

        /* 3D Flip Card Styles */
        .card-container {
            perspective: 1000px;
            width: 100%;
            max-width: 380px; /* Standard phone width */
            height: 720px; /* Increased to fit new buttons comfortably */
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Springy flip */
            transform-style: preserve-3d;
        }

        /* Toggled via JS */
        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-front {
            background-color: #68c6e8;
        }

        .card-back {
            transform: rotateY(180deg);
            align-items: center;
            justify-content: center;
            background-color: #68c6e8;
        }

        /* Subtle gold accents */
        .accent-gold {
            color: #d4af37;
        }
        .bg-accent-gold {
            background-color: #d4af37;
        }
        .border-accent-gold {
            border-color: #d4af37;
        }
        .hover-gold:hover {
            color: #111827;
            background-color: #d4af37;
            border-color: #d4af37;
        }

        /* Custom Yellow Text */
        .text-custom-yellow {
            color: #f7ff08;
        }

        /* Glowing effect */
        .glow-effect {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212,175,55,0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 50;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border: 1px solid #d4af37;
            width: max-content;
            max-width: 90vw;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Toast Notification Element -->
    <div id="toast" class="toast">Message</div>

    <div class="card-container group">
        <div class="card-inner" id="ecard">
            
            <!-- FRONT OF CARD -->
            <div class="card-face card-front p-6 relative">
                <div class="glow-effect"></div>
                
                <div class="relative z-10 flex flex-col h-full">
                    <!-- Top section: Name and Title -->
                    <div class="text-center mt-4 mb-6">
                        <div class="w-24 h-24 mx-auto bg-gray-800 rounded-full border-2 border-accent-gold flex items-center justify-center mb-4 shadow-[0_0_15px_rgba(212,175,55,0.3)]">
                            <i class="fa-solid fa-music text-3xl accent-gold"></i>
                        </div>
                        <h1 class="title-font text-3xl text-gray-900 font-bold tracking-wide mb-2">
                            Dr. Colbert Pierre
                        </h1>
                        <h2 class="text-sm uppercase tracking-[0.2em] text-custom-yellow font-bold drop-shadow-md bg-gray-900/30 inline-block px-3 py-1 rounded-full">
                            Artiste <span class="text-gray-200 mx-1">|</span> Poet <span class="text-gray-200 mx-1">|</span> Music
                        </h2>
                    </div>

                    <!-- Middle section: Action Buttons -->
                    <div class="flex-grow flex flex-col gap-3 justify-center mt-2">
                        
                        <!-- Click to Call -->
                        <a href="tel:5308404389" class="flex items-center w-full px-5 py-2.5 rounded-xl border border-gray-600 bg-gray-900/60 text-white transition-all duration-300 hover-gold group/btn shadow-sm backdrop-blur-sm">
                            <i class="fa-solid fa-phone w-6 text-center accent-gold group-hover/btn:text-gray-900 transition-colors"></i>
                            <span class="ml-4 font-medium">Click to Call</span>
                        </a>

                        <!-- Click to Text (SMS) -->
                        <a href="sms:5308404389" class="flex items-center w-full px-5 py-2.5 rounded-xl border border-gray-600 bg-gray-900/60 text-white transition-all duration-300 hover-gold group/btn shadow-sm backdrop-blur-sm">
                            <i class="fa-solid fa-comment-sms w-6 text-center accent-gold group-hover/btn:text-gray-900 transition-colors"></i>
                            <span class="ml-4 font-medium">Click to Text</span>
                        </a>

                        <!-- Save Contact -->
                        <button onclick="downloadVCard()" class="flex items-center w-full px-5 py-2.5 rounded-xl border border-gray-600 bg-gray-900/60 text-white transition-all duration-300 hover-gold group/btn shadow-sm backdrop-blur-sm">
                            <i class="fa-solid fa-user-plus w-6 text-center accent-gold group-hover/btn:text-gray-900 transition-colors"></i>
                            <span class="ml-4 font-medium">Save to Contacts</span>
                        </button>

                        <!-- Instagram -->
                        <a href="https://www.instagram.com/stra.t.o/" target="_blank" class="flex items-center w-full px-5 py-2.5 rounded-xl border border-gray-600 bg-gray-900/60 text-white transition-all duration-300 hover-gold group/btn shadow-sm backdrop-blur-sm">
                            <i class="fa-brands fa-instagram w-6 text-center accent-gold group-hover/btn:text-gray-900 transition-colors"></i>
                            <span class="ml-4 font-medium">Instagram</span>
                        </a>

                        <!-- Copy to Share -->
                        <button onclick="shareCard()" class="flex items-center w-full px-5 py-2.5 rounded-xl border border-gray-600 bg-gray-900/60 text-white transition-all duration-300 hover-gold group/btn shadow-sm backdrop-blur-sm">
                            <i class="fa-solid fa-share-nodes w-6 text-center accent-gold group-hover/btn:text-gray-900 transition-colors"></i>
                            <span class="ml-4 font-medium">Share Card</span>
                        </button>

                        <!-- Install App -->
                        <button onclick="promptInstall()" class="flex items-center w-full px-5 py-2.5 rounded-xl border border-gray-600 bg-gray-900/60 text-white transition-all duration-300 hover-gold group/btn shadow-sm backdrop-blur-sm">
                            <i class="fa-solid fa-download w-6 text-center accent-gold group-hover/btn:text-gray-900 transition-colors"></i>
                            <span class="ml-4 font-medium">Install App</span>
                        </button>
                    </div>

                    <!-- Bottom section: Flip to QR -->
                    <div class="mt-auto pt-6 pb-2 text-center">
                        <button onclick="toggleCard()" class="text-gray-800 hover:text-black transition-colors flex flex-col items-center mx-auto gap-2 font-semibold">
                            <i class="fa-solid fa-qrcode text-xl"></i>
                            <span class="text-xs uppercase tracking-wider">Tap for Website QR</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- BACK OF CARD -->
            <div class="card-face card-back p-6">
                <div class="glow-effect"></div>
                
                <div class="relative z-10 flex flex-col items-center justify-center h-full w-full text-center">

                    <!-- QR Code (Generated via Google/QRServer API) -->
                    <div class="p-4 bg-white rounded-2xl shadow-xl mb-8 mt-auto">
                        <img 
                            src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https%3A%2F%2Fcolbertlartiste.taniadomingue.multisiteadmin.com%2Fa%2Fpreview&margin=0" 
                            alt="Website QR Code" 
                            class="w-56 h-56 block"
                        >
                    </div>

                    <p class="text-xs text-gray-800 font-bold mb-auto bg-white/40 px-3 py-1 rounded-lg border border-white/50">colbertlartiste.taniadomingue.multisiteadmin.com</p>

                    <!-- Flip Back Button -->
                    <div class="mt-auto w-full pb-2">
                        <button onclick="toggleCard()" class="flex items-center justify-center w-full px-6 py-3 rounded-xl border border-gray-600 bg-gray-900/60 text-white transition-all duration-300 hover-gold group/btn shadow-sm font-medium tracking-wide backdrop-blur-sm">
                            <i class="fa-solid fa-arrow-rotate-left mr-2 accent-gold group-hover/btn:text-gray-900 transition-colors"></i> Back to Card
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        /**
         * Toggles the CSS class to flip the 3D card front and back.
         */
        function toggleCard() {
            const card = document.getElementById('ecard');
            card.classList.toggle('is-flipped');
        }

        /**
         * Generates a .vcf file string dynamically and triggers a download.
         * The email and phone are hidden in the UI but saved perfectly here.
         */
        function downloadVCard() {
            // vCard format 3.0
            const vCardData = `BEGIN:VCARD
VERSION:3.0
N:Pierre;Colbert;;Dr.;
FN:Dr. Colbert Pierre
ORG:Artiste | Poet | Music
TITLE:Artiste | Poet | Music
TEL;TYPE=CELL,VOICE:5308404389
EMAIL;TYPE=PREF,INTERNET:colpierre23@yahoo.fr
URL:https://colbertlartiste.taniadomingue.multisiteadmin.com/a/preview
URL:https://www.instagram.com/stra.t.o/
END:VCARD`;

            // Create a Blob containing the vCard data
            const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            // Create a temporary anchor element to trigger the download
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'Dr_Colbert_Pierre.vcf'); // Name of the downloaded file
            
            // Append to body, click, and clean up
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // Clean up the object URL to free memory
            URL.revokeObjectURL(url);
        }

        /**
         * Shows a temporary toast notification
         */
        function showNotification(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        /**
         * Copies the current URL to the clipboard or uses Web Share API if on mobile
         */
        function shareCard() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: 'Dr. Colbert Pierre - E-Card',
                    url: url
                }).catch(console.error);
            } else {
                // Fallback for desktop/iframes
                const tempInput = document.createElement("input");
                tempInput.value = url;
                document.body.appendChild(tempInput);
                tempInput.select();
                try {
                    document.execCommand("copy");
                    showNotification("Link copied to clipboard!");
                } catch (err) {
                    showNotification("Failed to copy link.");
                }
                document.body.removeChild(tempInput);
            }
        }

        /**
         * Prompts the user to install the app (Instructions)
         */
        function promptInstall() {
            showNotification("To install: tap your browser's Share icon and select 'Add to Home Screen'");
        }
    </script>
</body>
</html>
