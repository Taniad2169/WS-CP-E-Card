<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Colbert Pierre - E-Card</title>
    
    <!-- Web App Manifest for "Install to Home Screen" -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Theme color for browser address bar -->
    <meta name="theme-color" content="#0d8bbd">
    
    <!-- iOS support for Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Dr. Colbert">
    
    <!-- Icons: Apple Touch + Favicon -->
    <link rel="apple-touch-icon" sizes="198x198" href="icon-198x198.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-198x198.png">
    <link rel="icon" type="image/png" sizes="72x72" href="icon-72x72.png">
    <link rel="icon" type="image/png" sizes="198x198" href="icon-198x198.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512x512.png">
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Load QRCode.js for dynamic QR generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Configure custom colors in Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0d8bbd',       /* Deep Blue */
                        primaryHover: '#0a6d96',  
                        bgLight: '#66c8f2',       /* Light Blue Background */
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #66c8f2; /* Custom Light Blue */
        }

        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 3D Flip Card CSS */
        .perspective-1000 {
            perspective: 1000px;
        }
        
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        
        .flip-transition {
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .qr-container img {
            margin: 0 auto;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <!-- 3D Flip Card Container -->
    <div class="bg-transparent w-full max-w-sm h-[680px] perspective-1000 fade-in-up">
        
        <div id="flip-card-inner" class="relative w-full h-full transform-style-3d flip-transition shadow-2xl rounded-3xl">
            
            <!-- ================= FRONT FACE ================= -->
            <div class="absolute inset-0 w-full h-full backface-hidden bg-white rounded-3xl overflow-hidden flex flex-col">
                
                <div class="bg-primary h-28 w-full shrink-0 relative flex items-center justify-center">
                    <!-- Subtle abstract background pattern inside the header -->
                    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white to-transparent"></div>
                </div>

                <div class="relative flex justify-center -mt-14 shrink-0">
                    <div class="w-28 h-28 bg-white rounded-full p-1.5 shadow-lg">
                        <div class="w-full h-full bg-bgLight text-primary rounded-full flex items-center justify-center text-4xl font-bold border-4 border-primary">
                            CP
                        </div>
                    </div>
                </div>

                <div class="text-center px-6 pt-3 pb-2 flex-grow flex flex-col justify-between">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Dr. Colbert Pierre</h1>
                        <p class="text-sm font-semibold tracking-widest uppercase text-primary mt-1 mb-5">Artist | Poet | Music</p>
                        
                        <!-- Action Buttons Grid (No visible numbers/emails) -->
                        <div class="grid grid-cols-2 gap-3">
                            <a href="tel:5308404389" class="flex flex-col items-center justify-center p-3 bg-primary text-white rounded-xl hover:bg-primaryHover transition-all transform hover:scale-105 shadow-md border-b-4 border-primaryHover">
                                <i class="fa-solid fa-phone text-xl mb-1"></i>
                                <span class="text-xs font-semibold">Call</span>
                            </a>

                            <a href="https://wa.me/5308404389" target="_blank" class="flex flex-col items-center justify-center p-3 bg-primary text-white rounded-xl hover:bg-primaryHover transition-all transform hover:scale-105 shadow-md border-b-4 border-primaryHover">
                                <i class="fa-brands fa-whatsapp text-xl mb-1"></i>
                                <span class="text-xs font-semibold">WhatsApp</span>
                            </a>
                            
                            <a href="https://www.instagram.com/stra.t.o/" target="_blank" class="col-span-2 flex items-center justify-center gap-2 p-3 bg-gradient-to-r from-purple-500 via-pink-500 to-orange-500 text-white rounded-xl hover:opacity-90 transition-all transform hover:scale-[1.02] shadow-md border-b-4 border-pink-600">
                                <i class="fa-brands fa-instagram text-lg"></i>
                                <span class="text-sm font-bold">Follow on Instagram</span>
                            </a>
                        </div>

                        <!-- Utility Buttons (Save & Install) -->
                        <div class="grid grid-cols-2 gap-3 mt-3">
                            <button onclick="downloadVCard()" class="flex flex-col items-center justify-center p-3 bg-gray-800 text-white rounded-xl hover:bg-gray-900 transition-all shadow-md transform hover:scale-105 border-b-4 border-gray-950">
                                <i class="fa-solid fa-address-card text-xl mb-1"></i>
                                <span class="text-xs font-semibold">Save Contact</span>
                            </button>

                            <button onclick="installApp()" class="flex flex-col items-center justify-center p-3 bg-gray-800 text-white rounded-xl hover:bg-gray-900 transition-all shadow-md transform hover:scale-105 border-b-4 border-gray-950">
                                <i class="fa-solid fa-download text-xl mb-1"></i>
                                <span class="text-xs font-semibold">Install App</span>
                            </button>
                        </div>
                    </div>

                    <!-- Lower Actions (Share / QR) -->
                    <div class="flex gap-3 mt-4 mb-2">
                        <button onclick="shareCard()" class="flex-1 flex items-center justify-center gap-2 py-3 px-4 bg-bgLight/30 text-primary font-bold text-sm rounded-xl hover:bg-bgLight/60 transition-colors border border-primary/20">
                            <i class="fa-solid fa-share-nodes"></i>
                            <span id="share-text">Share Link</span>
                        </button>

                        <button onclick="flipCard()" class="flex-1 flex items-center justify-center gap-2 py-3 px-4 bg-bgLight/30 text-primary font-bold text-sm rounded-xl hover:bg-bgLight/60 transition-colors border border-primary/20">
                            <i class="fa-solid fa-qrcode"></i>
                            <span>View QR</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- ================= BACK FACE ================= -->
            <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 bg-white rounded-3xl overflow-hidden flex flex-col justify-between">
                
                <div class="bg-primary h-20 w-full flex items-center justify-center shadow-md">
                    <h2 class="text-white font-bold tracking-wider uppercase text-sm"><i class="fa-brands fa-instagram mr-2"></i> Instagram QR</h2>
                </div>

                <div class="flex flex-col items-center justify-center flex-1 px-6">
                    <p class="text-gray-800 font-bold text-xl mb-1">@stra.t.o</p>
                    <p class="text-sm text-gray-500 mb-6 text-center">Scan to discover my Art, Poetry, and Music.</p>
                    
                    <div class="p-4 bg-bgLight rounded-2xl shadow-inner border border-primary/30 transform transition-transform hover:scale-105">
                        <div id="qrcode" class="qr-container bg-white p-3 rounded-xl shadow-sm"></div>
                    </div>
                </div>

                <div class="p-6">
                    <button onclick="flipCard()" class="w-full flex items-center justify-center gap-2 py-3.5 px-4 bg-primary text-white font-bold text-sm rounded-xl hover:bg-primaryHover transition-all shadow-md border-b-4 border-primaryHover">
                        <i class="fa-solid fa-arrow-rotate-left"></i>
                        <span>Flip Back to Card</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Store the PWA install prompt event
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent the mini-infobar from appearing on mobile
            e.preventDefault();
            // Stash the event so it can be triggered later.
            deferredPrompt = e;
        });

        function installApp() {
            if (deferredPrompt) {
                // Show the install prompt native to the browser
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    }
                    deferredPrompt = null;
                });
            } else {
                // Fallback for iOS (Safari blocks automatic prompts) or already installed apps
                alert("To install this app on iOS:\n1. Tap the 'Share' icon at the bottom of Safari.\n2. Scroll down and tap 'Add to Home Screen'.\n\nIf you are on Android, check your browser's menu for 'Install App' or 'Add to Home Screen'.");
            }
        }

        function downloadVCard() {
            // VCard precisely mapping the phone number and email fields securely
            const vcard = `BEGIN:VCARD
VERSION:3.0
N:Pierre;Colbert;;Dr.;
FN:Dr. Colbert Pierre
TITLE:Artist | Poet | Music
TEL;TYPE=CELL:5308404389
EMAIL;TYPE=PREF,INTERNET:colpierre23@yahoo.fr
URL:https://www.instagram.com/stra.t.o/
END:VCARD`;
            
            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'Dr_Colbert_Pierre.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function flipCard() {
            const cardInner = document.getElementById('flip-card-inner');
            cardInner.classList.toggle('rotate-y-180');
        }

        function shareCard() {
            const urlToShare = window.location.href; 
            const tempInput = document.createElement("input");
            tempInput.value = urlToShare;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            
            const shareText = document.getElementById('share-text');
            const originalText = shareText.innerText;
            shareText.innerText = 'Copied!';
            
            setTimeout(() => {
                shareText.innerText = originalText;
            }, 2000);
        }

        window.onload = function() {
            // Generating the QR code specifically for the Instagram link
            const qrData = "https://www.instagram.com/stra.t.o/";
            const qrContainer = document.getElementById("qrcode");
            
            new QRCode(qrContainer, {
                text: qrData,
                width: 170, 
                height: 170, 
                colorDark : "#0d8bbd", 
                colorLight : "#ffffff", 
                correctLevel : QRCode.CorrectLevel.H 
            });
        };
    </script>
</body>
</html>
