<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5BC0DE">
    <title>Dr. Colbert Pierre</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Basic blue background, no stretching */
        body {
            background-color: #5BC0DE;
            color: #1A2B3C;
            display: flex;
            justify-content: center;
            padding: 20px 15px;
            min-height: 100vh;
        }

        /* Fixed-width card, no stretching */
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Header styles */
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .tagline {
            display: inline-block;
            background-color: #1A2B3C;
            color: #FFFFFF;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* --- BUTTONS - FIXED SIZE, NO STRETCHING --- */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-dark {
            background-color: #1A2B3C;
            color: #FFFFFF;
        }

        .btn-light {
            background-color: #FFFFFF;
            color: #1A2B3C;
        }

        /* Row for two buttons side-by-side */
        .btn-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .btn-row .btn {
            margin-bottom: 0;
        }

        /* --- SHARE INFO BOX - FIXED SIZE --- */
        .info-box {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: #8ED2E6;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            text-align: left;
        }

        .icon-circle {
            background-color: #1A2B3C;
            color: #FFFFFF;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .info-text {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .info-label {
            font-size: 11px;
            font-weight: 700;
            color: #555;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 800;
            color: #1A2B3C;
        }

        .copy-icon {
            color: #444;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <h1>Dr. Colbert Pierre</h1>
        <div class="tagline">Artiste | Poet | Music</div>

        <!-- Call & SMS Buttons -->
        <div class="btn-row">
            <a href="tel:5308404389" class="btn btn-dark">
                <i class="fas fa-phone-alt"></i> Call Direct
            </a>
            <a href="sms:5308404389" class="btn btn-light">
                <i class="fas fa-comment-alt"></i> Send SMS
            </a>
        </div>

        <!-- Instagram Button -->
        <a href="https://instagram.com" target="_blank" class="btn btn-dark">
            <i class="fab fa-instagram"></i> Instagram
        </a>

        <!-- Share Info Box -->
        <div class="info-box">
            <div class="icon-circle">
                <i class="fas fa-share-alt"></i>
            </div>
            <div class="info-text">
                <span class="info-label">Share This Card</span>
                <span class="info-value">Copy link to paste anywhere</span>
            </div>
            <i class="far fa-copy copy-icon" onclick="copyToClipboard(window.location.href)"></i>
        </div>

        <!-- Save Contact & QR Code -->
        <div class="btn-row">
            <button onclick="downloadVCard()" class="btn btn-dark">
                <i class="fas fa-user-plus"></i> Save Contact
            </button>
            <button onclick="alert('QR Code feature would generate a QR code for this page link.')" class="btn btn-light">
                <i class="fas fa-qrcode"></i> QR Code
            </button>
        </div>
    </div>

    <script>
        // --- 1. Service Worker Registration ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('serviceworker.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }

        // --- 2. Copy to Clipboard Function ---
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Link copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        // --- 3. Save Contact (vCard) Function ---
        function downloadVCard() {
            const name = "Dr. Colbert Pierre";
            const phone = "5308404389";
            const email = "colpierre23@yahoo.fr";

            const vcardData = `BEGIN:VCARD
VERSION:3.0
N:${name};;;;
FN:${name}
TEL;TYPE=CELL:${phone}
EMAIL:${email}
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Dr_Colbert_Pierre.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
