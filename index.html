<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dr. Colbert Pierre - E-Card</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            light: '#b1d6fa',
                            primary: '#0b8ad4',
                            bg: '#0b8ad4',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* prevent body scroll — card handles its own scroll */
            font-family: 'Inter', sans-serif;
            background-color: #0b8ad4;
        }

        /* Full-bleed card — fills entire viewport on every device */
        .flip-card {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* dynamic viewport height — accounts for mobile browser bars */
            perspective: 1200px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.is-flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            background-color: #0b8ad4;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
            /* Safe-area padding so content isn't hidden behind notches / home bars */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        .flip-card-front::-webkit-scrollbar,
        .flip-card-back::-webkit-scrollbar {
            display: none;
        }

        .flip-card-back {
            transform: rotateY(180deg);
        }

        .action-button {
            background-color: #ffffff;
            color: #0b8ad4;
            border-radius: 1rem;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border: none;
            width: 100%;
            text-decoration: none;
        }

        .action-button:hover, .action-button:active {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            color: #0968a3;
        }

        .action-icon-wrapper {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #eaf4fd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: all 0.2s;
        }

        .action-button:hover .action-icon-wrapper {
            background-color: #0b8ad4;
            color: #ffffff;
        }

        @keyframes slideUpFade {
            0% { transform: translate(-50%, 20px); opacity: 0; }
            100% { transform: translate(-50%, 0); opacity: 1; }
        }

        .toast-visible {
            animation: slideUpFade 0.4s ease forwards;
            display: flex !important;
        }
    </style>
</head>
<body>

    <div class="flip-card" id="cardContainer">
        <div class="flip-card-inner">

            <!-- ================= FRONT ================= -->
            <div class="flip-card-front p-5 sm:p-6">

                <div class="w-full flex justify-center mb-4 shrink-0">
                    <div class="w-full max-w-[280px] aspect-square rounded-2xl overflow-hidden border-4 border-white shadow-lg bg-white flex items-center justify-center relative">
                        <img id="profile-picture"
                             src="colbert-artiste.jpg"
                             alt="The Colbert L'Artiste — Artisan Brushworks, Est. 2024"
                             class="w-full h-full object-cover"
                             onerror="this.onerror=null;this.src='https://placehold.co/600x600/0b8ad4/ffffff?text=Colbert+L%27Artiste';">
                    </div>
                </div>

                <div class="text-center text-white mb-6 shrink-0">
                    <h1 class="font-serif text-2xl sm:text-3xl font-bold tracking-wide drop-shadow-md mb-2">
                        Dr. Colbert Pierre
                    </h1>
                    <div class="flex items-center justify-center space-x-2 text-[11px] sm:text-xs font-bold tracking-[0.2em] uppercase drop-shadow-sm opacity-90">
                        <span>Music</span>
                        <span class="w-1.5 h-1.5 rounded-full bg-white"></span>
                        <span>Art</span>
                        <span class="w-1.5 h-1.5 rounded-full bg-white"></span>
                        <span>Poetry</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-4 shrink-0">
                    <a href="tel:5308404389" class="action-button">
                        <div class="action-icon-wrapper"><i class="fas fa-phone"></i></div>
                        <span class="text-xs font-bold text-gray-700">Call</span>
                    </a>
                    <a href="sms:5308404389" class="action-button">
                        <div class="action-icon-wrapper"><i class="fas fa-comment-sms"></i></div>
                        <span class="text-xs font-bold text-gray-700">Text</span>
                    </a>
                    <a href="mailto:colpierre23@yahoo.fr" class="action-button">
                        <div class="action-icon-wrapper"><i class="fas fa-envelope"></i></div>
                        <span class="text-xs font-bold text-gray-700">Email</span>
                    </a>
                    <a href="https://www.instagram.com/stra.t.o/" target="_blank" rel="noopener" class="action-button">
                        <div class="action-icon-wrapper"><i class="fab fa-instagram"></i></div>
                        <span class="text-xs font-bold text-gray-700">Instagram</span>
                    </a>
                    <button onclick="shareCard()" class="action-button col-span-2 flex-row py-3">
                        <i class="fas fa-share-nodes text-xl mr-2"></i>
                        <span class="text-sm font-bold text-gray-700">Copy &amp; Share Card</span>
                    </button>
                </div>

                <button onclick="toggleFlip()" class="w-full bg-brand-primary text-white font-bold py-4 px-6 rounded-xl flex items-center justify-center gap-3 shadow-md hover:bg-blue-600 transition-colors border border-white/50 shrink-0 mb-5">
                    <i class="fas fa-qrcode text-xl"></i>
                    <span class="tracking-wide">Scan QR Code</span>
                </button>

                <div class="mt-auto pt-4 border-t border-white/40 flex flex-col items-center gap-3 shrink-0 pb-6">
                    <span class="text-[10px] text-white uppercase tracking-widest font-bold">Install to Device</span>
                    <div class="flex gap-3 w-full">
                        <button onclick="showInstallInstructions('iOS')" class="flex-1 bg-white/20 hover:bg-white/30 text-white py-2.5 rounded-lg text-xs font-bold flex items-center justify-center gap-2 border border-white/30 transition-colors">
                            <i class="fab fa-apple text-sm"></i> iOS
                        </button>
                        <button onclick="showInstallInstructions('Android')" class="flex-1 bg-white/20 hover:bg-white/30 text-white py-2.5 rounded-lg text-xs font-bold flex items-center justify-center gap-2 border border-white/30 transition-colors">
                            <i class="fab fa-android text-sm"></i> Android
                        </button>
                    </div>
                </div>

            </div>

            <!-- ================= BACK ================= -->
            <div class="flip-card-back p-6 flex flex-col items-center justify-center">

                <div class="text-center text-white mb-8">
                    <h2 class="font-serif text-3xl font-bold mb-3 drop-shadow-md">Scan to Connect</h2>
                    <p class="text-sm font-medium opacity-90 px-4">Point your camera at this code to view the full website and portfolio.</p>
                </div>

                <div class="bg-white p-5 rounded-3xl shadow-xl border-4 border-white/50 mb-8">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://colbertlartiste.taniadomingue.multisiteadmin.com/a/preview"
                         alt="QR Code"
                         class="w-56 h-56 object-contain">
                </div>

                <button onclick="toggleFlip()" class="w-full bg-white text-brand-primary font-bold py-4 px-6 rounded-xl flex items-center justify-center gap-3 shadow-lg hover:bg-gray-50 transition-all max-w-[280px]">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back to Profile</span>
                </button>

            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toastNotification" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden w-[90%] max-w-sm flex-col bg-white rounded-2xl shadow-2xl border border-gray-100 overflow-hidden">
        <div class="p-5 flex flex-col items-center text-center relative">
            <button onclick="hideToast()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600">
                <i class="fas fa-times"></i>
            </button>
            <div id="toastIcon" class="w-12 h-12 rounded-full mb-3 flex items-center justify-center text-2xl"></div>
            <h3 id="toastTitle" class="text-gray-900 font-bold text-lg mb-2"></h3>
            <p id="toastMessage" class="text-gray-600 text-sm leading-relaxed mb-4"></p>
            <button onclick="hideToast()" class="w-full bg-brand-primary text-white font-bold py-2.5 rounded-xl hover:bg-blue-600 transition-colors">
                Understood
            </button>
        </div>
    </div>

    <script>
        const cardContainer = document.getElementById('cardContainer');
        const toastNotification = document.getElementById('toastNotification');
        const toastTitle = document.getElementById('toastTitle');
        const toastMessage = document.getElementById('toastMessage');
        const toastIcon = document.getElementById('toastIcon');

        function toggleFlip() {
            cardContainer.classList.toggle('is-flipped');
        }

        function showToast(title, message, iconHTML, iconBgClass, iconTextClass) {
            toastTitle.textContent = title;
            toastMessage.innerHTML = message;
            toastIcon.className = `w-14 h-14 rounded-full mb-3 flex items-center justify-center text-2xl ${iconBgClass} ${iconTextClass}`;
            toastIcon.innerHTML = iconHTML;
            toastNotification.classList.remove('hidden');
            toastNotification.classList.add('toast-visible');
        }

        function hideToast() {
            toastNotification.classList.remove('toast-visible');
            setTimeout(() => {
                toastNotification.classList.add('hidden');
            }, 300);
        }

        async function shareCard() {
            const shareUrl = 'https://colbertlartiste.taniadomingue.multisiteadmin.com/a/preview';
            try {
                if (navigator.share) {
                    await navigator.share({
                        title: 'Dr. Colbert Pierre | Music, Art, Poetry',
                        text: 'View the portfolio and contact information for Dr. Colbert Pierre.',
                        url: shareUrl
                    });
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = shareUrl;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);

                    showToast(
                        'Link Copied!',
                        'The website link has been successfully copied to your clipboard. You can now paste it anywhere.',
                        '<i class="fas fa-check"></i>',
                        'bg-green-100',
                        'text-green-600'
                    );
                }
            } catch (err) {
                console.log('Share error or cancelled:', err);
            }
        }

        function showInstallInstructions(os) {
            if (os === 'iOS') {
                showToast(
                    'Install on iPhone / iPad',
                    'Tap the <strong>Share</strong> icon <i class="fas fa-square-arrow-up mx-1 border rounded px-1"></i> at the bottom of Safari, then scroll down and tap <strong>"Add to Home Screen"</strong>.',
                    '<i class="fab fa-apple"></i>',
                    'bg-gray-100',
                    'text-gray-800'
                );
            } else if (os === 'Android') {
                showToast(
                    'Install on Android',
                    'Tap the <strong>Menu</strong> icon <i class="fas fa-ellipsis-v mx-1 border rounded px-1"></i> (three dots) in your browser, then tap <strong>"Add to Home screen"</strong>.',
                    '<i class="fab fa-android"></i>',
                    'bg-blue-50',
                    'text-brand-primary'
                );
            }
        }
    </script>
</body>
</html>
