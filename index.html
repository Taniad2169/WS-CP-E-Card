<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Colbert Pierre - E-Card</title>
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Theme color for browser address bar -->
    <meta name="theme-color" content="#ffffff">
    
    <!-- iOS support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Dr. Colbert">
    
    <!-- Icons -->
    <link rel="apple-touch-icon" sizes="198x198" href="icon-198x198.png">
    <link rel="icon" type="image/png" sizes="72x72" href="icon-72x72.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0d8bbd',
                        primaryHover: '#0a6d96',
                        bgLight: '#66c8f2',
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 3D Flip Card CSS */
        .perspective-1000 {
            perspective: 1000px;
            width: 100%;
            height: 100vh; 
            min-height: 850px; /* Fixes the blank screen by giving it height */
        }
        
        .transform-style-3d {
            transform-style: preserve-3d;
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        
        .flip-transition {
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .qr-container img {
            margin: 0 auto;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body>

    <!-- 3D Flip Card Container -->
    <div class="perspective-1000">
        
        <div id="flip-card-inner" class="transform-style-3d flip-transition">
            
            <!-- ================= FRONT FACE ================= -->
            <div class="backface-hidden bg-white overflow-hidden flex flex-col">
                
                <!-- Header Image (Using colbert.png) -->
                <div class="w-full h-48 shrink-0 bg-gray-100">
                    <img src="https://taniad2169.github.io/WS-CP-E-Card/colbert-header.jpg" alt="Colbert L'Artiste Header" class="w-full h-full object-cover">
                </div>

                <!-- Profile Icon -->
                <div class="relative flex justify-center -mt-14 shrink-0 z-10">
                    <div class="w-28 h-28 bg-white rounded-full p-1.5 shadow-lg">
                        <div class="w-full h-full bg-bgLight text-primary rounded-full flex items-center justify-center text-4xl font-bold border-4 border-primary">
                            CP
                        </div>
                    </div>
                </div>

                <!-- Main Content -->
                <div class="text-center px-6 pt-3 pb-8 flex flex-col">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Dr. Colbert Pierre</h1>
                        <p class="text-sm font-semibold tracking-widest uppercase text-primary mt-1 mb-5">Artist | Poet | Music</p>
                        
                        <!-- Action Buttons -->
                        <div class="grid grid-cols-2 gap-3">
                            <a href="tel:5308404389" class="flex flex-col items-center justify-center p-3 bg-primary text-white rounded-xl hover:bg-primaryHover transition-all transform hover:scale-105 shadow-md border-b-4 border-primaryHover">
                                <i class="fa-solid fa-phone text-xl mb-1"></i>
                                <span class="text-xs font-semibold">Call</span>
                            </a>

                            <a href="sms:5308404389" class="flex flex-col items-center justify-center p-3 bg-primary text-white rounded-xl hover:bg-primaryHover transition-all transform hover:scale-105 shadow-md border-b-4 border-primaryHover">
                                <i class="fa-solid fa-comment-sms text-xl mb-1"></i>
                                <span class="text-xs font-semibold">Text Message</span>
                            </a>
                            
                            <a href="https://www.instagram.com/stra.t.o/" target="_blank" class="col-span-2 flex items-center justify-center gap-2 p-3 bg-gradient-to-r from-purple-500 via-pink-500 to-orange-500 text-white rounded-xl hover:opacity-90 transition-all transform hover:scale-[1.02] shadow-md border-b-4 border-pink-600">
                                <i class="fa-brands fa-instagram text-lg"></i>
                                <span class="text-sm font-bold">Follow on Instagram</span>
                            </a>
                        </div>

                        <!-- Utility Buttons -->
                        <div class="grid grid-cols-2 gap-3 mt-3">
                            <button onclick="downloadVCard()" class="flex flex-col items-center justify-center p-3 bg-gray-800 text-white rounded-xl hover:bg-gray-900 transition-all shadow-md transform hover:scale-105 border-b-4 border-gray-950">
                                <i class="fa-solid fa-address-card text-xl mb-1"></i>
                                <span class="text-xs font-semibold">Save Contact</span>
                            </button>

                            <button onclick="installApp()" class="flex flex-col items-center justify-center p-3 bg-gray-800 text-white rounded-xl hover:bg-gray-900 transition-all shadow-md transform hover:scale-105 border-b-4 border-gray-950">
                                <i class="fa-solid fa-download text-xl mb-1"></i>
                                <span class="text-xs font-semibold">Install App</span>
                            </button>
                        </div>
                    </div>

                    <!-- Lower Actions -->
                    <div class="flex gap-3 mt-6 mb-2">
                        <button onclick="shareCard()" class="flex-1 flex items-center justify-center gap-2 py-3 px-4 bg-bgLight/30 text-primary font-bold text-sm rounded-xl hover:bg-bgLight/60 transition-colors border border-primary/20">
                            <i class="fa-solid fa-share-nodes"></i>
                            <span id="share-text">Share Link</span>
                        </button>

                        <button onclick="flipCard()" class="flex-1 flex items-center justify-center gap-2 py-3 px-4 bg-bgLight/30 text-primary font-bold text-sm rounded-xl hover:bg-bgLight/60 transition-colors border border-primary/20">
                            <i class="fa-solid fa-qrcode"></i>
                            <span>View QR</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- ================= BACK FACE ================= -->
            <div class="backface-hidden rotate-y-180 bg-white overflow-hidden flex flex-col justify-between">
                
                <div class="bg-primary h-20 w-full flex items-center justify-center shadow-md shrink-0">
                    <h2 class="text-white font-bold tracking-wider uppercase text-sm"><i class="fa-solid fa-globe mr-2"></i> Website Preview QR</h2>
                </div>

                <div class="flex flex-col items-center justify-center flex-1 px-6">
                    <p class="text-gray-800 font-bold text-xl mb-1">Colbert L’Artiste</p>
                    <p class="text-sm text-gray-500 mb-6 text-center">Scan to visit my website preview.</p>
                    
                    <div class="p-4 bg-bgLight rounded-2xl shadow-inner border border-primary/30 transform transition-transform hover:scale-105">
                        <div id="qrcode" class="qr-container bg-white p-3 rounded-xl shadow-sm"></div>
                    </div>
                </div>

                <div class="p-6 shrink-0">
                    <button onclick="flipCard()" class="w-full flex items-center justify-center gap-2 py-3.5 px-4 bg-primary text-white font-bold text-sm rounded-xl hover:bg-primaryHover transition-all shadow-md border-b-4 border-primaryHover">
                        <i class="fa-solid fa-arrow-rotate-left"></i>
                        <span>Flip Back to Card</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    }
                    deferredPrompt = null;
                });
            } else {
                alert("To install this app on iOS:\n1. Tap the 'Share' icon at the bottom of Safari.\n2. Scroll down and tap 'Add to Home Screen'.\n\nIf you are on Android, check your browser's menu for 'Install App' or 'Add to Home Screen'.");
            }
        }

        function downloadVCard() {
            const vcard = `BEGIN:VCARD
VERSION:3.0
N:Pierre;Colbert;;Dr.;
FN:Dr. Colbert Pierre
TITLE:Artist | Poet | Music
TEL;TYPE=CELL,VOICE:5308404389
EMAIL;TYPE=PREF,INTERNET:colpierre23@yahoo.fr
URL:https://www.instagram.com/stra.t.o/
END:VCARD`;
            
            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'Dr_Colbert_Pierre.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function flipCard() {
            const cardInner = document.getElementById('flip-card-inner');
            cardInner.classList.toggle('rotate-y-180');
        }

        function shareCard() {
            const urlToShare = window.location.href; 
            const tempInput = document.createElement("input");
            tempInput.value = urlToShare;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            
            const shareText = document.getElementById('share-text');
            const originalText = shareText.innerText;
            shareText.innerText = 'Copied!';
            
            setTimeout(() => {
                shareText.innerText = originalText;
            }, 2000);
        }

        window.onload = function() {
            const qrData = "https://colbertlartiste.taniadomingue.multisiteadmin.com/a/preview";
            const qrContainer = document.getElementById("qrcode");
            
            new QRCode(qrContainer, {
                text: qrData,
                width: 170, 
                height: 170, 
                colorDark : "#0d8bbd", 
                colorLight : "#ffffff", 
                correctLevel : QRCode.CorrectLevel.H 
            });
        };
    </script>
</body>
</html>
