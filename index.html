<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This meta tag is crucial to stop mobile phones from zooming out and making things tiny -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#5BC0DE">
    <title>Dr. Colbert Pierre</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-blue: #5BC0DE;
            --dark-btn: #1A2B3C;
            --light-btn: #FFFFFF;
            --text-dark: #1A2B3C;
            --text-light: #FFFFFF;
            --card-bg: #8ED2E6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-blue);
            color: var(--text-dark);
            min-height: 100%;
            width: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
        }

        /* Container holds everything with a nice gap, no forced stretching */
        .container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px; 
            text-align: center;
            margin: auto 0; 
        }

        /* Header */
        h1 {
            font-size: 32px; 
            font-weight: 800;
            line-height: 1.2;
        }

        .tagline {
            display: inline-block;
            background-color: var(--dark-btn);
            color: var(--text-light);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 10px;
            align-self: center;
        }

        /* Button Rows */
        .btn-row {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        /* Fixed button size, rounded pill shape, side-by-side icon and text */
        .btn {
            flex: 1;
            padding: 18px 10px; 
            border-radius: 50px; /* Pill shape */
            border: none;
            font-size: 16px; 
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: row; /* Side by side */
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: transform 0.1s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            touch-action: manipulation; /* Ensures instant tap response on mobile */
        }

        .btn i {
            font-size: 20px; 
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-dark {
            background-color: var(--dark-btn);
            color: var(--text-light);
        }

        .btn-light {
            background-color: var(--light-btn);
            color: var(--text-dark);
        }

        /* Instagram Button */
        .btn-full {
            width: 100%;
        }

        /* Info Box */
        .info-box {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            text-align: left;
            gap: 15px;
            width: 100%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            touch-action: manipulation;
        }

        .info-box:active {
            transform: scale(0.98);
        }

        .icon-circle {
            background-color: var(--dark-btn);
            color: var(--text-light);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .info-content {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .info-label {
            font-size: 12px;
            font-weight: 700;
            color: #555;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-dark);
        }

        .copy-icon {
            color: #444;
            font-size: 22px;
            cursor: pointer;
            padding: 5px;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div>
            <h1>Dr. Colbert Pierre</h1>
            <div class="tagline">Artiste | Poet | Music</div>
        </div>

        <!-- Call & SMS Buttons -->
        <div class="btn-row">
            <a href="tel:5308404389" class="btn btn-dark">
                <i class="fas fa-phone-alt"></i> Call Direct
            </a>
            <a href="sms:5308404389" class="btn btn-light">
                <i class="fas fa-comment-alt"></i> Send SMS
            </a>
        </div>

        <!-- Instagram Button -->
        <a href="https://instagram.com" target="_blank" class="btn btn-dark btn-full">
            <i class="fab fa-instagram"></i> Instagram
        </a>

        <!-- Share Info Box -->
        <div class="info-box">
            <div class="icon-circle">
                <i class="fas fa-share-alt"></i>
            </div>
            <div class="info-content">
                <span class="info-label">Share This Card</span>
                <span class="info-value">Copy link to paste anywhere</span>
            </div>
            <i class="far fa-copy copy-icon" onclick="copyToClipboard(window.location.href)"></i>
        </div>

        <!-- Save Contact & QR Code -->
        <div class="btn-row">
            <button onclick="downloadVCard()" class="btn btn-dark">
                <i class="fas fa-user-plus"></i> Save Contact
            </button>
            <button onclick="alert('QR Code feature would generate a QR code for this page link.')" class="btn btn-light">
                <i class="fas fa-qrcode"></i> QR Code
            </button>
        </div>
    </div>

    <script>
        // --- 1. Service Worker Registration ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('serviceworker.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }

        // --- 2. Copy to Clipboard Function ---
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Link copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        // --- 3. Save Contact (vCard) Function ---
        function downloadVCard() {
            const name = "Dr. Colbert Pierre";
            const phone = "5308404389";
            const email = "colpierre23@yahoo.fr"; // Hidden from screen

            const vcardData = `BEGIN:VCARD
VERSION:3.0
N:${name};;;;
FN:${name}
TEL;TYPE=CELL:${phone}
EMAIL:${email}
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Dr_Colbert_Pierre.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
