<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dr. Colbert Pierre | Music · Art · Poetry</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            background-color: #084c73;
        }

        body {
            margin: 0;
            padding: 24px 18px;
            min-height: 100vh;
            background-color: #084c73;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        /* Simple block — no flex, no 3D, no collapsing */
        .wrapper {
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
            padding-bottom: 22px;
            border-bottom: 1px solid rgba(255,255,255,0.25);
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 10px;
        }

        .tagline {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            opacity: 0.85;
        }

        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ffffff;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 16px;
            background-color: #ffffff;
            color: #084c73;
            text-decoration: none;
            border: 2px solid #ffffff;
            border-radius: 14px;
            padding: 16px 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.35);
            text-align: left;
            width: 100%;
            min-height: 64px;
            transition: transform 0.15s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-icon {
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: 10px;
            background-color: #e6f0f6;
            color: #084c73;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .btn-label {
            flex: 1;
            font-size: 16px;
            font-weight: 700;
            color: #084c73;
        }

        .btn-arrow {
            font-size: 13px;
            opacity: 0.4;
            color: #084c73;
        }

        /* QR section */
        .qr-section {
            margin-top: 30px;
            text-align: center;
        }

        .qr-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            opacity: 0.85;
            margin-bottom: 14px;
        }

        .qr-box {
            display: inline-block;
            background: #ffffff;
            padding: 14px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.35);
        }

        .qr-box img {
            display: block;
            width: 200px;
            height: 200px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translate(-50%, 20px);
            background: #ffffff;
            color: #084c73;
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .toast i { color: #16a34a; }

        @media (max-width: 380px) {
            body { padding: 18px 14px; }
            .header h1 { font-size: 26px; }
            .btn { padding: 14px 16px; min-height: 58px; font-size: 15px; gap: 12px; }
            .btn-icon { width: 38px; height: 38px; min-width: 38px; font-size: 16px; }
            .qr-box img { width: 170px; height: 170px; }
        }
    </style>
</head>
<body>

    <div class="wrapper">

        <div class="header">
            <h1>Dr. Colbert Pierre</h1>
            <div class="tagline">
                <span>Music</span>
                <span class="dot"></span>
                <span>Art</span>
                <span class="dot"></span>
                <span>Poetry</span>
            </div>
        </div>

        <div class="buttons">

            <a href="tel:+15308404389" class="btn">
                <div class="btn-icon"><i class="fas fa-phone"></i></div>
                <span class="btn-label">Tap to Call</span>
                <i class="fas fa-chevron-right btn-arrow"></i>
            </a>

            <a href="sms:+15308404389" class="btn">
                <div class="btn-icon"><i class="fas fa-comment-sms"></i></div>
                <span class="btn-label">Tap to Text</span>
                <i class="fas fa-chevron-right btn-arrow"></i>
            </a>

            <a href="mailto:colpierre23@yahoo.fr" class="btn">
                <div class="btn-icon"><i class="fas fa-envelope"></i></div>
                <span class="btn-label">Tap to Email</span>
                <i class="fas fa-chevron-right btn-arrow"></i>
            </a>

            <a href="https://www.instagram.com/stra.t.o/" target="_blank" rel="noopener" class="btn">
                <div class="btn-icon"><i class="fab fa-instagram"></i></div>
                <span class="btn-label">Tap for Instagram</span>
                <i class="fas fa-chevron-right btn-arrow"></i>
            </a>

            <button onclick="downloadVCard()" class="btn">
                <div class="btn-icon"><i class="fas fa-address-card"></i></div>
                <span class="btn-label">Tap to Save Contact</span>
                <i class="fas fa-chevron-right btn-arrow"></i>
            </button>

            <button onclick="shareCard()" class="btn">
                <div class="btn-icon"><i class="fas fa-share-nodes"></i></div>
                <span class="btn-label">Tap to Share</span>
                <i class="fas fa-chevron-right btn-arrow"></i>
            </button>

        </div>

        <div class="qr-section">
            <div class="qr-title">Scan to Connect</div>
            <div class="qr-box">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://colbertlartiste.taniadomingue.multisiteadmin.com/a/preview"
                     alt="QR Code">
            </div>
        </div>

    </div>

    <div id="toast" class="toast">
        <i class="fas fa-check"></i>
        <span id="toastText">Done</span>
    </div>

    <script>
        const SHARE_URL = 'https://colbertlartiste.taniadomingue.multisiteadmin.com/a/preview';

        function downloadVCard() {
            const vcard = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                'N:Pierre;Colbert;;Dr.;',
                'FN:Dr. Colbert Pierre',
                'TITLE:Musician, Artist, Poet',
                'TEL;TYPE=CELL:+15308404389',
                'EMAIL;TYPE=INTERNET:colpierre23@yahoo.fr',
                'URL:' + SHARE_URL,
                'X-SOCIALPROFILE;TYPE=instagram:https://www.instagram.com/stra.t.o/',
                'NOTE:Music - Art - Poetry',
                'END:VCARD'
            ].join('\r\n');

            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Dr-Colbert-Pierre.vcf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast('Contact card ready to save');
        }

        async function shareCard() {
            try {
                if (navigator.share) {
                    await navigator.share({
                        title: 'Dr. Colbert Pierre',
                        text: 'Music · Art · Poetry',
                        url: SHARE_URL
                    });
                } else {
                    await copyToClipboard(SHARE_URL);
                    showToast('Link copied to clipboard');
                }
            } catch (err) {
                console.log('Share cancelled or failed', err);
            }
        }

        function copyToClipboard(text) {
            return new Promise((resolve, reject) => {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(resolve).catch(() => {
                        fallbackCopy(text, resolve, reject);
                    });
                } else {
                    fallbackCopy(text, resolve, reject);
                }
            });
        }

        function fallbackCopy(text, resolve, reject) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); resolve(); }
            catch (e) { reject(e); }
            document.body.removeChild(ta);
        }

        let toastTimer;
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastText').textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }
    </script>

</body>
</html>
