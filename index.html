<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dr. Colbert Pierre | Music · Art · Poetry</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #084c73;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 18px;
        }

        /* ===== FLIP CONTAINER ===== */
        .flip-container {
            width: 100%;
            max-width: 460px;
            perspective: 1400px;
        }

        .flip-inner {
            position: relative;
            width: 100%;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .flip-inner.flipped {
            transform: rotateY(180deg);
        }

        .flip-front,
        .flip-back {
            width: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .flip-back {
            position: absolute;
            inset: 0;
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 22px;
            background-color: #0a5a87;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 22px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.35);
        }

        /* ===== FRONT CARD ===== */
        .card {
            background-color: #0a5a87;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 22px;
            padding: 28px 22px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.35);
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 26px;
            padding-bottom: 22px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1.15;
            margin-bottom: 10px;
        }

        .header .tagline {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            opacity: 0.85;
        }

        .header .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ffffff;
            display: inline-block;
        }

        /* ===== BUTTONS ===== */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 16px;
            background-color: #ffffff;
            color: #084c73;
            text-decoration: none;
            border: 2px solid #ffffff;
            border-radius: 14px;
            padding: 16px 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.35), 0 2px 4px rgba(0,0,0,0.25);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            text-align: left;
            width: 100%;
        }

        .btn:active {
            transform: translateY(1px) scale(0.985);
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
        }

        .btn-icon {
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: 10px;
            background-color: #e6f0f6;
            color: #084c73;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s ease;
        }

        .btn:hover .btn-icon {
            background-color: #084c73;
            color: #ffffff;
        }

        .btn-label {
            flex: 1;
            font-size: 15px;
            font-weight: 700;
            color: #084c73;
        }

        .btn-arrow {
            font-size: 13px;
            opacity: 0.4;
            transition: all 0.2s ease;
        }

        .btn:hover .btn-arrow {
            opacity: 1;
            transform: translateX(3px);
        }

        /* ===== BACK CARD ===== */
        .back-title {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .back-sub {
            font-size: 13px;
            opacity: 0.85;
            text-align: center;
            margin-bottom: 24px;
            padding: 0 10px;
        }

        .qr-box {
            background: #ffffff;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
            margin-bottom: 26px;
        }

        .qr-box img {
            display: block;
            width: 220px;
            height: 220px;
        }

        .back-btn {
            background: #ffffff;
            color: #084c73;
            border: 2px solid #ffffff;
            border-radius: 14px;
            padding: 16px 24px;
            font-family: inherit;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.35);
            transition: transform 0.15s ease;
            letter-spacing: 0.03em;
        }

        .back-btn:active {
            transform: translateY(1px) scale(0.985);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translate(-50%, 20px);
            background: #ffffff;
            color: #084c73;
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 100;
            max-width: calc(100% - 40px);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .toast i { color: #16a34a; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 380px) {
            .header h1 { font-size: 26px; }
            .btn { padding: 14px 16px; gap: 12px; font-size: 15px; }
            .btn-icon { width: 38px; height: 38px; min-width: 38px; font-size: 16px; }
            .qr-box img { width: 180px; height: 180px; }
        }
    </style>
</head>
<body>

    <div class="flip-container">
        <div id="flipInner" class="flip-inner">

            <!-- ============ FRONT ============ -->
            <div class="flip-front">
                <div class="card">

                    <div class="header">
                        <h1>Dr. Colbert Pierre</h1>
                        <div class="tagline">
                            <span>Music</span>
                            <span class="dot"></span>
                            <span>Art</span>
                            <span class="dot"></span>
                            <span>Poetry</span>
                        </div>
                    </div>

                    <div class="buttons">

                        <!-- Tap to Call -->
                        <a href="tel:+15308404389" class="btn">
                            <div class="btn-icon"><i class="fas fa-phone"></i></div>
                            <span class="btn-label">Tap to Call</span>
                            <i class="fas fa-chevron-right btn-arrow"></i>
                        </a>

                        <!-- Tap to Text -->
                        <a href="sms:+15308404389" class="btn">
                            <div class="btn-icon"><i class="fas fa-comment-sms"></i></div>
                            <span class="btn-label">Tap to Text</span>
                            <i class="fas fa-chevron-right btn-arrow"></i>
                        </a>

                        <!-- Tap to Email -->
                        <a href="mailto:colpierre23@yahoo.fr" class="btn">
                            <div class="btn-icon"><i class="fas fa-envelope"></i></div>
                            <span class="btn-label">Tap to Email</span>
                            <i class="fas fa-chevron-right btn-arrow"></i>
                        </a>

                        <!-- Tap for Instagram -->
                        <a href="https://www.instagram.com/stra.t.o/" target="_blank" rel="noopener" class="btn">
                            <div class="btn-icon"><i class="fab fa-instagram"></i></div>
                            <span class="btn-label">Tap for Instagram</span>
                            <i class="fas fa-chevron-right btn-arrow"></i>
                        </a>

                        <!-- Tap to Save Contact -->
                        <button onclick="downloadVCard()" class="btn">
                            <div class="btn-icon"><i class="fas fa-address-card"></i></div>
                            <span class="btn-label">Tap to Save Contact</span>
                            <i class="fas fa-chevron-right btn-arrow"></i>
                        </button>

                        <!-- Tap to Share -->
                        <button onclick="shareCard()" class="btn">
                            <div class="btn-icon"><i class="fas fa-share-nodes"></i></div>
                            <span class="btn-label">Tap to Share</span>
                            <i class="fas fa-chevron-right btn-arrow"></i>
                        </button>

                        <!-- Tap to Flip to QR -->
                        <button onclick="toggleFlip()" class="btn">
                            <div class="btn-icon"><i class="fas fa-qrcode"></i></div>
                            <span class="btn-label">Tap for QR Code</span>
                            <i class="fas fa-chevron-right btn-arrow"></i>
                        </button>

                    </div>
                </div>
            </div>

            <!-- ============ BACK (QR) ============ -->
            <div class="flip-back">
                <div class="back-title">Scan to Connect</div>
                <div class="back-sub">Point your camera at the QR code to open the portfolio</div>

                <div class="qr-box">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://colbertlartiste.taniadomingue.multisiteadmin.com/a/preview"
                         alt="QR Code">
                </div>

                <button onclick="toggleFlip()" class="back-btn">
                    <i class="fas fa-arrow-left"></i>
                    Back to Card
                </button>
            </div>

        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast">
        <i class="fas fa-check"></i>
        <span id="toastText">Done</span>
    </div>

    <script>
        const SHARE_URL = 'https://colbertlartiste.taniadomingue.multisiteadmin.com/a/preview';

        /* ===== Flip ===== */
        function toggleFlip() {
            document.getElementById('flipInner').classList.toggle('flipped');
        }

        /* ===== Save Contact (vCard) — iOS & Android compatible ===== */
        function downloadVCard() {
            const vcard = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                'N:Pierre;Colbert;;Dr.;',
                'FN:Dr. Colbert Pierre',
                'TITLE:Musician, Artist, Poet',
                'TEL;TYPE=CELL:+15308404389',
                'EMAIL;TYPE=INTERNET:colpierre23@yahoo.fr',
                'URL:' + SHARE_URL,
                'X-SOCIALPROFILE;TYPE=instagram:https://www.instagram.com/stra.t.o/',
                'NOTE:Music - Art - Poetry',
                'END:VCARD'
            ].join('\r\n');

            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Dr-Colbert-Pierre.vcf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast('Contact card ready to save');
        }

        /* ===== Share ===== */
        async function shareCard() {
            try {
                if (navigator.share) {
                    await navigator.share({
                        title: 'Dr. Colbert Pierre',
                        text: 'Music · Art · Poetry',
                        url: SHARE_URL
                    });
                } else {
                    await copyToClipboard(SHARE_URL);
                    showToast('Link copied to clipboard');
                }
            } catch (err) {
                console.log('Share cancelled or failed', err);
            }
        }

        /* ===== Clipboard ===== */
        function copyToClipboard(text) {
            return new Promise((resolve, reject) => {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(resolve).catch(() => {
                        fallbackCopy(text, resolve, reject);
                    });
                } else {
                    fallbackCopy(text, resolve, reject);
                }
            });
        }

        function fallbackCopy(text, resolve, reject) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); resolve(); }
            catch (e) { reject(e); }
            document.body.removeChild(ta);
        }

        /* ===== Toast ===== */
        let toastTimer;
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastText').textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }
    </script>

</body>
</html>
