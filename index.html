<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#5BC0DE">
    <meta name="description" content="Digital business card for Dr. Colbert Pierre - Artiste, Poet, Musician">
    <title>Dr. Colbert Pierre</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Colbert Pierre">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-blue: #5BC0DE;
            --dark-btn: #1A2B3C;
            --light-btn: #FFFFFF;
            --text-dark: #1A2B3C;
            --text-light: #FFFFFF;
            --card-bg: #8ED2E6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
            -moz-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        html, body {
            background-color: var(--bg-blue);
            color: var(--text-dark);
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* 3D flip between front and back. The outer box's height is set
           by JS to whichever face is taller, so nothing ever clips. */
        .flip-container {
            perspective: 1400px;
            position: relative;
            width: 100%;
        }

        .flip-inner {
            position: relative;
            width: 100%;
            transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .flip-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .flip-face.flip-back {
            transform: rotateY(180deg);
        }

        .logo-img {
            width: 100%;
            max-width: 220px;
            margin: 4px auto 0;
            display: block;
            border-radius: 16px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .tagline {
            display: inline-block;
            background-color: var(--dark-btn);
            color: var(--text-light);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 15px;
            align-self: center;
        }

        /* Buttons - fixed size, never stretched by a flex parent */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 100%;
            min-height: 56px;
            height: 56px;
            padding: 0 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            text-decoration: none;
            flex-grow: 0;
            flex-shrink: 0;
            flex-basis: auto;
            -webkit-text-size-adjust: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn i {
            font-size: 18px;
        }

        .btn-dark {
            background-color: var(--dark-btn);
            color: var(--text-light);
        }

        .btn-light {
            background-color: var(--light-btn);
            color: var(--text-dark);
        }

        .info-box {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            width: 100%;
            flex-grow: 0;
            flex-shrink: 0;
        }

        .icon-circle {
            background-color: var(--dark-btn);
            color: var(--text-light);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .info-text {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .info-label {
            font-size: 11px;
            font-weight: 700;
            color: #555;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-dark);
        }

        .copy-icon {
            color: #444;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }

        .qr-section {
            margin-top: 6px;
            background-color: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 0;
            flex-shrink: 0;
        }

        .qr-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 5px;
            color: var(--dark-btn);
        }

        .qr-subtitle {
            font-size: 13px;
            margin-bottom: 15px;
            color: #555;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="flip-container">
            <div class="flip-inner" id="flipInner">

                <!-- FRONT FACE -->
                <div id="frontView" class="flip-face flip-front">
                    <div>
                        <h1>Dr. Colbert Pierre</h1>
                        <div class="tagline">Artiste | Poet | Music</div>
                    </div>

                    <a href="tel:+15308404389" class="btn btn-dark">
                        <i class="fas fa-phone-alt"></i> Call Direct
                    </a>

                    <a href="sms:+15308404389" class="btn btn-light">
                        <i class="fas fa-comment-alt"></i> Send SMS
                    </a>

                    <a href="https://www.instagram.com/stra.t.o/" target="_blank" class="btn btn-dark">
                        <i class="fab fa-instagram"></i> Instagram
                    </a>

                    <div class="info-box">
                        <div class="icon-circle">
                            <i class="fas fa-share-alt"></i>
                        </div>
                        <div class="info-text">
                            <span class="info-label">Share This Card</span>
                            <span class="info-value">Copy link to paste anywhere</span>
                        </div>
                        <i class="far fa-copy copy-icon" onclick="copyToClipboard(window.location.href)"></i>
                    </div>

                    <button onclick="downloadVCard()" class="btn btn-dark">
                        <i class="fas fa-user-plus"></i> Save Contact
                    </button>

                    <button onclick="showBack()" class="btn btn-light">
                        <i class="fas fa-qrcode"></i> Show QR Code
                    </button>

                    <img src="logo.png" alt="Colbert L'Artiste" class="logo-img" onload="sizeFlipContainer()">
                </div>

                <!-- BACK FACE -->
                <div id="backView" class="flip-face flip-back">
                    <div class="qr-section">
                        <div class="qr-title">Scan to Connect</div>
                        <div class="qr-subtitle">Point your camera here</div>
                        <div id="qrcode"></div>
                    </div>

                    <button onclick="showFront()" class="btn btn-dark" style="margin-top:12px;">
                        <i class="fas fa-arrow-left"></i> Back to Card
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- Service Worker Registration ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }

        // --- Generate the QR Code once, up front ---
        let qrGenerated = false;
        function generateQR() {
            if (qrGenerated) return;
            new QRCode(document.getElementById("qrcode"), {
                text: "https://colbertlartiste.taniadomingue.multisiteadmin.com/a/preview",
                width: 180,
                height: 180,
                colorDark: "#1A2B3C",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
            qrGenerated = true;
        }
        window.addEventListener('load', generateQR);

        // --- Flip between front and back (real 3D flip) ---
        // Both faces are absolutely positioned so they can overlap during
        // the animation; that means the flip container has no natural
        // height, so we measure both faces and size it to the taller one.
        function sizeFlipContainer() {
            const inner = document.getElementById('flipInner');
            const front = document.getElementById('frontView');
            const back = document.getElementById('backView');
            const tallest = Math.max(front.offsetHeight, back.offsetHeight);
            inner.style.height = tallest + 'px';
        }
        window.addEventListener('load', sizeFlipContainer);
        window.addEventListener('resize', sizeFlipContainer);

        function showBack() {
            document.getElementById('flipInner').classList.add('is-flipped');
        }
        function showFront() {
            document.getElementById('flipInner').classList.remove('is-flipped');
        }

        // --- Copy to Clipboard ---
        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    alert('Link copied to clipboard!');
                }).catch(() => legacyCopy(text));
            } else {
                legacyCopy(text);
            }
        }
        function legacyCopy(text) {
            const tempInput = document.createElement('input');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');
                alert('Link copied to clipboard!');
            } catch (err) {
                alert('Could not copy link.');
            }
            document.body.removeChild(tempInput);
        }

        // --- Save Contact (vCard) ---
        function downloadVCard() {
            const name = "Dr. Colbert Pierre";
            const phone = "+15308404389";
            const email = "colpierre23@yahoo.fr";

            const vcardData = `BEGIN:VCARD
VERSION:3.0
N:Pierre;Colbert;;Dr.;
FN:${name}
ORG:Artiste | Poet | Music
TITLE:Artiste | Poet | Music
TEL;TYPE=CELL:${phone}
EMAIL:${email}
URL:https://colbertlartiste.taniadomingue.multisiteadmin.com/a/preview
URL:https://www.instagram.com/stra.t.o/
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            const link = document.createElement('a');
            link.href = url;
            link.download = 'Dr_Colbert_Pierre.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
