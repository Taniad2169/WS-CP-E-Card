<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#5BC0DE">
    <title>Dr. Colbert Pierre</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-blue: #5BC0DE;
            --dark-btn: #1A2B3C;
            --light-btn: #FFFFFF;
            --text-dark: #1A2B3C;
            --text-light: #FFFFFF;
            --card-bg: #8ED2E6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            /* STOP ANDROID FROM AUTO-ZOOMING TEXT */
            -webkit-text-size-adjust: 100%;
            -moz-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        html, body {
            background-color: var(--bg-blue);
            color: var(--text-dark);
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Prevents stretching */
            padding: 20px 15px;
        }

        /* The Main Container */
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: stretch;
        }

        /* Header styles */
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .tagline {
            display: inline-block;
            background-color: var(--dark-btn);
            color: var(--text-light);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 15px;
            align-self: center;
        }

        /* Buttons - LOCKED SIZE, NO STRETCHING */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 100%;
            /* Forces the button to be exactly this tall */
            min-height: 56px;
            height: 56px;
            padding: 0 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            text-decoration: none;
            /* CRITICAL: Stops Android from stretching */
            flex-grow: 0; 
            flex-shrink: 0;
            flex-basis: auto;
            /* Stop Android text zoom */
            -webkit-text-size-adjust: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn i {
            font-size: 18px;
        }

        .btn-dark {
            background-color: var(--dark-btn);
            color: var(--text-light);
        }

        .btn-light {
            background-color: var(--light-btn);
            color: var(--text-dark);
        }

        /* Info Box */
        .info-box {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            width: 100%;
            flex-grow: 0; 
            flex-shrink: 0;
        }

        .icon-circle {
            background-color: var(--dark-btn);
            color: var(--text-light);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .info-text {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .info-label {
            font-size: 11px;
            font-weight: 700;
            color: #555;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-dark);
        }

        .copy-icon {
            color: #444;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }

        /* QR Code Section at the Footer */
        .qr-section {
            margin-top: 20px;
            background-color: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 0;
            flex-shrink: 0;
        }

        .qr-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 5px;
            color: var(--dark-btn);
        }

        .qr-subtitle {
            font-size: 13px;
            margin-bottom: 15px;
            color: #555;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div>
            <h1>Dr. Colbert Pierre</h1>
            <div class="tagline">Artiste | Poet | Music</div>
        </div>

        <!-- 1. Call Direct (Added +1 country code) -->
        <a href="tel:+15308404389" class="btn btn-dark">
            <i class="fas fa-phone-alt"></i> Call Direct
        </a>

        <!-- 2. Send SMS (Added +1 country code) -->
        <a href="sms:+15308404389" class="btn btn-light">
            <i class="fas fa-comment-alt"></i> Send SMS
        </a>

        <!-- 3. Instagram -->
        <a href="https://instagram.com" target="_blank" class="btn btn-dark">
            <i class="fab fa-instagram"></i> Instagram
        </a>

        <!-- 4. Share Info Box -->
        <div class="info-box">
            <div class="icon-circle">
                <i class="fas fa-share-alt"></i>
            </div>
            <div class="info-text">
                <span class="info-label">Share This Card</span>
                <span class="info-value">Copy link to paste anywhere</span>
            </div>
            <i class="far fa-copy copy-icon" onclick="copyToClipboard(window.location.href)"></i>
        </div>

        <!-- 5. Save Contact -->
        <button onclick="downloadVCard()" class="btn btn-dark">
            <i class="fas fa-user-plus"></i> Save Contact
        </button>

        <!-- 6. Show QR Code Button -->
        <button onclick="scrollToQR()" class="btn btn-light">
            <i class="fas fa-qrcode"></i> Show QR Code
        </button>

        <!-- 7. QR Code Section (Footer) -->
        <div class="qr-section" id="qrFooter">
            <div class="qr-title">Scan to Connect</div>
            <div class="qr-subtitle">Point your camera here</div>
            <div id="qrcode"></div>
        </div>
    </div>

    <script>
        // --- 1. Service Worker Registration ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('serviceworker.js')
                    .then(registration => { console.log('ServiceWorker registered'); })
                    .catch(err => { console.log('ServiceWorker registration failed: ', err); });
            });
        }

        // --- 2. Generate the QR Code ---
        window.addEventListener('load', () => {
            new QRCode(document.getElementById("qrcode"), {
                text: "https://colbertlartiste.taniadomingue.multisiteadmin.com/a/preview", 
                width: 180,
                height: 180,
                colorDark : "#1A2B3C",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        });

        // --- 3. Scroll to QR Code Function ---
        function scrollToQR() {
            const qrSection = document.getElementById('qrFooter');
            qrSection.scrollIntoView({ behavior: 'smooth' });
        }

        // --- 4. Copy to Clipboard Function ---
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Link copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        // --- 5. Save Contact (vCard) Function ---
        function downloadVCard() {
            const name = "Dr. Colbert Pierre";
            // Using +1 country code so Android & iPhone recognize it as a full US number
            const phone = "+15308404389";
            const email = "colpierre23@yahoo.fr";

            const vcardData = `BEGIN:VCARD
VERSION:3.0
N:${name};;;;
FN:${name}
TEL;TYPE=CELL:${phone}
EMAIL:${email}
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Dr_Colbert_Pierre.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
